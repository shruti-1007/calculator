<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="floaties" aria-hidden="true">
      <span class="floaty floaty-heart heart-one">&#10084;</span>
      <span class="floaty floaty-flower flower-one">&#10047;</span>
      <span class="floaty floaty-star star-one">&#9733;</span>
      <span class="floaty floaty-heart heart-two">&#9829;</span>
      <span class="floaty floaty-flower flower-two">&#10048;</span>
      <span class="floaty floaty-sparkle sparkle-one">&#10022;</span>
      <span class="floaty floaty-cloud cloud-one">&#9729;</span>
      <span class="floaty floaty-star star-two">&#9734;</span>
      <span class="floaty floaty-heart heart-three">&#9825;</span>
      <span class="floaty floaty-flower flower-three">&#10049;</span>
      <span class="floaty floaty-sparkle sparkle-two">&#10024;</span>
      <span class="floaty floaty-heart heart-four">&#9825;</span>
      <span class="floaty floaty-flower flower-four">&#10047;</span>
      <span class="floaty floaty-star star-three">&#10025;</span>
      <span class="floaty floaty-cloud cloud-two">&#9728;</span>
      <span class="floaty floaty-butterfly butterfly-one">&#10048;</span>
      <span class="floaty floaty-sparkle sparkle-three">&#10038;</span>
    </div>
    <h1>Calculator</h1>
    <div class="body">
      <div class="screen">
        <div class="history"></div>
        <div class="now"></div>
      </div>
      <div class="main">
        <div class="row">
          <span><button id="openparanthesis">(</button></span>
          <span><button id="rightparanthesis">)</button></span>
          <span><button id="percent">%</button></span>
          <span><button id="ac">AC</button></span>
        </div>
        <div class="row">
          <span><button id="7">7</button></span>
          <span><button id="8">8</button></span>
          <span><button id="9">9</button></span>
          <span><button id="div">/</button></span>
        </div>
        <div class="row">
          <span><button id="4">4</button></span>
          <span><button id="5">5</button></span>
          <span><button id="6">6</button></span>
          <span><button id="mul">*</button></span>
        </div>
        <div class="row">
          <span><button id="1">1</button></span>
          <span><button id="2">2</button></span>
          <span><button id="3">3</button></span>
          <span><button id="sub">-</button></span>
        </div>
        <div class="row">
          <span><button id="0">0</button></span>
          <span><button id="dec">.</button></span>
          <span><button id="equals">=</button></span>
          <span><button id="add">+</button></span>
        </div>
        <div class="row">
          <span><button id="del">DEL</button></span>
          <span><button id="clearhistory">Clear History</button></span>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
